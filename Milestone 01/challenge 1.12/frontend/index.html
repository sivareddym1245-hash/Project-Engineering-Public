<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AI Chatbot</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; display: flex; justify-content: center; background: #f4f4f9; }
    #chat-container { width: 100%; max-width: 500px; border-radius: 8px; overflow: hidden; background: #fff; box-shadow: 0 4px 10px rgba(0,0,0,0.1); height: 75vh; display: flex; flex-direction: column; }
    #chat-display { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
    .message { padding: 10px 14px; border-radius: 6px; max-width: 80%; line-height: 1.4; }
    .user { background: #007bff; color: white; align-self: flex-end; }
    .assistant { background: #e9ecef; color: black; align-self: flex-start; }
    #input-area { display: flex; padding: 15px; border-top: 1px solid #ddd; background: #fafafa; }
    #message-input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 4px; margin-right: 10px; }
    button { padding: 10px 20px; background: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; }
    button:hover { background: #218838; }
  </style>
</head>
<body>

<div id="chat-container">
  <div id="chat-display"></div>
  <div id="input-area">
    <input type="text" id="message-input" placeholder="Message the AI..." />
    <button id="send-btn">Send</button>
  </div>
</div>

<script>
  const chatDisplay = document.getElementById('chat-display');
  const messageInput = document.getElementById('message-input');
  const sendBtn = document.getElementById('send-btn');

  // This array holds the conversation history
  let messages = []; 
  
  // URL to your local backend server
  const BACKEND_URL = 'https://project-engineering-public-1.onrender.com/chat'; 

  function renderMessages() {
    chatDisplay.innerHTML = '';
    messages.forEach(msg => {
      const div = document.createElement('div');
      div.className = `message ${msg.role}`;
      div.textContent = msg.content;
      chatDisplay.appendChild(div);
    });
    chatDisplay.scrollTop = chatDisplay.scrollHeight;
  }

  async function sendMessage() {
    const text = messageInput.value.trim();
    if (!text) return;

    // 1. Add user message to array and render
    messages.push({ role: 'user', content: text });
    messageInput.value = '';
    renderMessages();

    try {
      // 2. Send FULL history to the backend
      const response = await fetch(BACKEND_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages })
      });

      const data = await response.json();
      
      // 3. Add AI response to array and render
      if (data.reply) {
        messages.push(data.reply); 
        renderMessages();
      }
    } catch (error) {
      console.error('Error fetching chat:', error);
      alert('Failed to connect to the backend server.');
    }
  }

  sendBtn.addEventListener('click', sendMessage);
  messageInput.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') sendMessage();
  });
</script>
</body>
</html>
